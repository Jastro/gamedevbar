name: Build and Deploy

# Push to main → image in GHCR (ghcr.io/jastro/gamedevbar, public) → Portainer
# webhook. The stack (app + its TURN settings) and the coturn relay live in the
# server owner's git-ops repo, not here.
#
# The registry login uses the workflow's own GITHUB_TOKEN, so the only repository
# secret is PORTAINER_WEBHOOK_URL (Settings → Secrets and variables → Actions):
# it can only redeploy the `taberna` stack with the image already published.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jastro/gamedevbar

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push the image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Redeploy in Portainer
        run: |
          set -eu
          # No fallback on purpose: if the webhook fails, the bar stays on the
          # old image and the run must show red.
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          echo "Portainer webhook triggered"
