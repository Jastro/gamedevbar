name: Build and Deploy Docker Image to Personal Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get short commit SHA
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -t jacobocaraballo-taberna:${{ env.COMMIT_SHA }} .

      - name: Save Docker Image to File
        run: docker save jacobocaraballo-taberna:${{ env.COMMIT_SHA }} -o jacobocaraballo-taberna.tar

      - name: Transfer Docker Image to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # deploy/ holds the remote deploy script and the coturn relay files (Docs/TURN.md).
          source: ./jacobocaraballo-taberna.tar,deploy
          target: ~/_docker/jacobocaraballo_taberna

      - name: Run Docker Container
        uses: appleboy/ssh-action@v0.1.4
        env:
          IMAGE_TAG: ${{ env.COMMIT_SHA }}
          # Optional. Without TURN_SECRET the deploy is the same as before (no relay).
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          TURN_HOST: ${{ vars.TURN_HOST }}
          TURN_APP_SERVICE: ${{ vars.TURN_APP_SERVICE }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,TURN_SECRET,TURN_HOST,TURN_APP_SERVICE
          script: |
            cd ~/_docker/jacobocaraballo_taberna
            bash deploy/remote-deploy.sh
