# TURN relay for voice chat, started by deploy/remote-deploy.sh as its own
# compose project ("taberna-coturn"), separate from the app's compose file.
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking: the relay needs 200 UDP ports, which Docker port mapping handles poorly.
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.generated.conf:/etc/coturn/turnserver.conf:ro
