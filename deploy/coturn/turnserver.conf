# coturn config for the voice-chat relay (see Docs/TURN.md).
# deploy/remote-deploy.sh appends `realm=` and `static-auth-secret=` and writes
# turnserver.generated.conf, which is what the container uses.
listening-port=3478
fingerprint
use-auth-secret
# Relay ports: one per relayed connection side; 200 is plenty for a bar.
# Keep in sync with the firewall rules in Docs/TURN.md.
min-port=49160
max-port=49360
no-cli
no-multicast-peers
no-tls
no-dtls
total-quota=200
user-quota=12
stale-nonce=600
log-file=stdout
# Never relay into the server's own/private networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
