<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taberna Virtual MV Gamedev</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #username-dialog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(26, 26, 26, 0.97) 0%, rgba(38, 38, 38, 0.97) 100%);
      padding: 20px;
      z-index: 2000;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5vh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1a1a1a 0%, #262626 100%);
      color: white;
      transition: opacity 0.4s ease;
    }

    #loading-screen.done {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen .loading-title {
      font-size: 2.4em;
      font-weight: 600;
      color: #dc5a0b;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    #loading-screen .loading-text {
      font-size: 1.1em;
      opacity: 0.8;
      animation: loading-pulse 1.4s ease-in-out infinite;
    }

    @keyframes loading-pulse {
      50% { opacity: 0.35; }
    }

    #username-dialog h3 {
      font-size: 2em;
      margin: 0 0 1em 0;
      color: #dc5a0b;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      font-weight: 600;
      position: relative;
      padding-bottom: 0.5em;
      max-width: 800px;
    }

    #username-dialog h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #dc5a0b, transparent);
    }

    #username-dialog input {
      margin: 10px 0;
      padding: 12px 20px;
      width: 300px;
      border: 2px solid rgba(220, 90, 11, 0.3);
      border-radius: 8px;
      font-size: 1.1em;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      transition: all 0.3s ease;
    }

    #username-dialog input:focus {
      outline: none;
      border-color: #dc5a0b;
      box-shadow: 0 0 15px rgba(220, 90, 11, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    #username-dialog input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #username-dialog button {
      color: #ffffff;
      background: linear-gradient(45deg, #dc5a0b, #ff7b2c);
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.2em;
      cursor: pointer;
      margin-top: 2em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(220, 90, 11, 0.3);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #username-dialog button:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.7;
      box-shadow: none;
    }

    #username-dialog button:disabled:hover {
      transform: none;
      box-shadow: none;
    }

    #username-dialog button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 90, 11, 0.4);
      background: linear-gradient(45deg, #ff7b2c, #dc5a0b);
    }

    #username-dialog button:active {
      transform: translateY(1px);
    }

    #chat-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      z-index: 1001;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chat-input {
      position: relative;
      width: 100%;
      padding: 14px 20px;
      border: 2px solid rgba(220, 90, 11, 0.3);
      border-radius: 12px;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
      letter-spacing: 0.3px;
    }

    #chat-input:focus {
      outline: none;
      border-color: #dc5a0b;
      box-shadow: 0 0 0 3px rgba(220, 90, 11, 0.2), 0 4px 20px rgba(0, 0, 0, 0.3);
      background: rgba(0, 0, 0, 0.95);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    #chat-box {
      position: fixed;
      left: 20px;
      bottom: 90px;
      width: 450px;
      height: 400px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border-radius: 16px;
      padding: 15px;
      overflow-y: auto;
      font-family: 'Segoe UI', Arial, sans-serif;
      z-index: 1000;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(220, 90, 11, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.2;
    }

    #chat-box::-webkit-scrollbar {
      width: 8px;
    }

    #chat-box::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin: 4px;
    }

    #chat-box::-webkit-scrollbar-thumb {
      background: rgba(220, 90, 11, 0.5);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    #chat-box::-webkit-scrollbar-thumb:hover {
      background: rgba(220, 90, 11, 0.7);
    }

    .chat-message {
      margin: 1px 0;
      padding: 6px 10px;
      word-wrap: break-word;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.3;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
      letter-spacing: 0.2px;
    }

    .chat-message:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(2px);
    }

    .chat-message strong {
      color: #dc5a0b;
      font-weight: 600;
      margin-right: 6px;
    }

    .emote-message {
      color: #ff9d8f;
      font-style: italic;
      background: rgba(255, 157, 143, 0.05);
      border-left: 2px solid #ff9d8f;
      padding-left: 12px;
    }

    .emote-message strong {
      color: #ff9d8f;
    }

    .hidden {
      display: none !important;
    }

    /* Animación para nuevos mensajes */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message {
      animation: fadeIn 0.2s ease forwards;
    }

    #emote-button {
      position: absolute;
      right: -60px;
      bottom: 0;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: rgba(220, 90, 11, 0.9);
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1002;
    }

    #voice-button {
      position: absolute;
      right: -115px;
      bottom: 0;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: rgba(40, 40, 40, 0.9);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1002;
      touch-action: none;
      user-select: none;
      transition: all 0.15s ease;
    }

    #voice-settings-button {
      position: absolute;
      right: -162px;
      bottom: 4px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 1002;
      transition: all 0.15s ease;
    }

    #customize-button {
      position: absolute;
      right: -205px;
      bottom: 4px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 1002;
      transition: all 0.15s ease;
    }

    #help-button {
      position: absolute;
      right: -248px;
      bottom: 4px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.9);
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 1002;
      transition: all 0.15s ease;
    }

    #help-button:hover,
    #customize-button:hover,
    #voice-settings-button:hover,
    #voice-settings-button.active {
      background: rgba(220, 90, 11, 0.9);
    }

    #voice-settings {
      position: absolute;
      bottom: 60px;
      right: -170px;
      width: 300px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 14px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid rgba(220, 90, 11, 0.3);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1003;
    }

    #voice-settings .voice-settings-title {
      font-weight: 600;
      font-size: 15px;
    }

    #voice-settings .voice-settings-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    #voice-settings select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(220, 90, 11, 0.4);
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
    }

    #voice-settings .volume-sliders {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #voice-settings .volume-row {
      display: grid;
      grid-template-columns: 92px 1fr 40px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    #voice-settings .volume-row input {
      width: 100%;
      accent-color: #dc5a0b;
    }

    #voice-settings .volume-value {
      text-align: right;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    #voice-settings .voice-meter {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    #voice-settings .voice-meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #dc5a0b);
      transition: width 0.05s linear;
    }

    #voice-settings .voice-settings-hint {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    #voice-settings .voice-peers {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
    }

    #voice-settings .voice-peer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }

    #voice-settings .voice-peer-status {
      color: rgba(255, 255, 255, 0.6);
    }

    #voice-settings .voice-peer.connected .voice-peer-status {
      color: #4caf50;
    }

    #voice-settings .voice-peer.failed .voice-peer-status {
      color: #f44336;
    }

    #voice-settings .voice-peer-empty {
      color: rgba(255, 255, 255, 0.5);
    }

    #voice-settings .voice-settings-action {
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #dc5a0b;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    #voice-settings .voice-settings-action.secondary {
      background: rgba(255, 255, 255, 0.1);
    }

    /* CSS3D layer (projector iframes) sits under the transparent WebGL canvas. */
    #css3d-layer,
    #webgl-layer {
      position: absolute;
      top: 0;
      left: 0;
    }

    #css3d-layer {
      z-index: 0;
      pointer-events: none;
    }

    #webgl-layer {
      z-index: 1;
    }

    .projector-video {
      background: #000;
      pointer-events: none;
    }

    .projector-video iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .floating-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(360px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid rgba(220, 90, 11, 0.4);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 14px;
      z-index: 1500;
    }

    .floating-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .floating-panel-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      cursor: pointer;
    }

    .floating-panel-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .floating-panel-actions {
      display: flex;
      gap: 8px;
    }

    .floating-panel-actions .floating-panel-button {
      flex: 1;
    }

    .floating-panel-button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #dc5a0b;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .floating-panel-button.secondary {
      background: rgba(255, 255, 255, 0.12);
    }

    .floating-panel-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #customize-panel {
      width: min(560px, calc(100% - 32px));
    }

    /* Wide screens: keep the panel at the side so your avatar stays in view
       while you dress it. */
    @media (min-width: 1100px) {
      #customize-panel {
        left: 24px;
        transform: translateY(-50%);
      }
    }

    .customize-tabs {
      display: flex;
      gap: 6px;
    }

    .customize-tabs button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
    }

    .customize-tabs button.active {
      background: #dc5a0b;
    }

    .customize-page {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .customize-section {
      color: #dc5a0b;
      font-weight: 600;
      margin-top: 4px;
    }

    .customize-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 6px;
    }

    .customize-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
    }

    .customize-item-icon {
      font-size: 22px;
    }

    .customize-item.selected,
    .customize-swatch.selected {
      border-color: #dc5a0b;
      background: rgba(220, 90, 11, 0.2);
    }

    .customize-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .customize-swatch {
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
    }

    .customize-scale {
      width: 100%;
    }

    #customize-panel .model-selector h4 {
      font-size: 14px;
      margin: 4px 0 0;
    }

    #customize-panel .model-options {
      gap: 8px;
      padding: 4px 0;
    }

    #customize-panel .model-option {
      padding: 4px;
    }

    #customize-panel .model-preview {
      height: 110px;
    }

    #customize-panel .model-preview canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .customize-name-row {
      display: flex;
      gap: 8px;
    }

    .customize-name-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid rgba(220, 90, 11, 0.4);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14px;
    }

    #controls-panel {
      width: min(440px, calc(100% - 32px));
    }

    .controls-section {
      color: #dc5a0b;
      font-weight: 600;
      margin-top: 4px;
    }

    .controls-list {
      display: grid;
      grid-template-columns: minmax(90px, 38%) 1fr;
      gap: 4px 12px;
      margin: 0;
    }

    .controls-list dt {
      font-family: monospace;
      color: #ffd27f;
    }

    .controls-list dd {
      margin: 0;
      color: rgba(255, 255, 255, 0.85);
    }

    .floating-panel-note {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    .radio-stations {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .radio-station {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 8px 10px;
      border: 1px solid rgba(220, 90, 11, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .radio-station:hover {
      background: rgba(220, 90, 11, 0.15);
    }

    .radio-station.active {
      border-color: #dc5a0b;
      background: rgba(220, 90, 11, 0.25);
    }

    .radio-station-name {
      font-weight: 600;
      font-size: 13px;
    }

    .radio-station-genre {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
    }

    .vircon-screen {
      background: #000;
      pointer-events: none;
    }

    .vircon-screen iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* Playing a web game (Pokebonk): mouse goes to its iframe, not the 3D world. */
    .vircon-screen.interactive,
    .vircon-screen.interactive iframe {
      pointer-events: auto;
    }

    body.webgame-playing #webgl-layer {
      pointer-events: none;
    }

    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 1900;
    }

    #fade-overlay.visible {
      opacity: 1;
    }

    #car-countdown {
      position: fixed;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      z-index: 1800;
      pointer-events: none;
    }

    #webgame-exit {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1600;
      display: flex;
      gap: 8px;
    }

    #webgame-exit a,
    #webgame-exit button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    #webgame-exit button {
      background: #dc5a0b;
    }

    .vircon-roms {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .vircon-rom:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .vircon-upload {
      text-align: center;
    }

    .projector-form {
      display: flex;
      gap: 8px;
    }

    .projector-form input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(220, 90, 11, 0.4);
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
    }

    #voice-button.open-mic {
      background: rgba(46, 125, 50, 0.95);
    }

    #voice-button.muted {
      background: rgba(90, 90, 90, 0.95);
      opacity: 0.85;
    }

    #voice-settings .voice-open-mic {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    #voice-settings .voice-open-mic input {
      accent-color: #dc5a0b;
    }

    #voice-button.talking {
      background: #d93025;
      box-shadow: 0 0 0 4px rgba(217, 48, 37, 0.35), 0 0 20px rgba(217, 48, 37, 0.6);
      transform: scale(1.08);
    }

    #emote-button:hover {
      background: rgba(220, 90, 11, 1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 90, 11, 0.3);
    }

    #emotes-panel {
      position: fixed;
      width: 280px;
      background: rgba(0, 0, 0, 0.95);
      border-radius: 16px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(220, 90, 11, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 1002;
    }

    .emote-item {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.05);
    }

    .emote-item:hover {
      background: rgba(220, 90, 11, 0.3);
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 90, 11, 0.2);
    }

    /* Animación para el panel de emotes */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #emotes-panel:not(.hidden) {
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .taberna-message {
      color: #ffd700 !important;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      background-color: rgba(139, 69, 19, 0.1) !important;
      margin: 1px 0;
      border-left: 2px solid #8b4513 !important;
    }

    .taberna-tag {
      background-color: #8b4513;
      color: #ffd700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8em;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    /* Sobreescribir el hover para mensajes de taberna */
    .taberna-message:hover {
      background-color: rgba(139, 69, 19, 0.2) !important;
      transform: translateX(2px);
    }

    .model-selector {
      margin: 15px 0;
      width: 100%;
      max-width: 1000px;
    }

    .model-selector h4 {
      font-size: 1.2em;
      margin: 0 0 0.8em 0;
    }

    .model-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 10px;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .model-option {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(220, 90, 11, 0.1);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .model-option:hover {
      transform: translateY(-5px);
      background: rgba(220, 90, 11, 0.1);
      border-color: rgba(220, 90, 11, 0.3);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .model-option.selected {
      border-color: #dc5a0b;
      background: rgba(220, 90, 11, 0.15);
      box-shadow: 0 0 20px rgba(220, 90, 11, 0.3);
    }

    .model-preview {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
    }

    .model-preview canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .model-option span {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 1em;
      color: #ffffff;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .room-selector {
      margin: 5px 0 0 0;
      width: 100%;
      max-width: 1000px;
    }

    .room-selector h4 {
      font-size: 1.2em;
      margin: 0 0 0.8em 0;
    }

    .room-options {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .room-option {
      min-width: 200px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(220, 90, 11, 0.1);
      border-radius: 12px;
      padding: 14px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      outline: none;
    }

    .room-option:hover,
    .room-option:focus-visible {
      transform: translateY(-3px);
      background: rgba(220, 90, 11, 0.1);
      border-color: rgba(220, 90, 11, 0.3);
    }

    .room-option.selected {
      border-color: #dc5a0b;
      background: rgba(220, 90, 11, 0.15);
      box-shadow: 0 0 20px rgba(220, 90, 11, 0.3);
    }

    .room-option .room-name {
      font-size: 1.2em;
      font-weight: 600;
      color: #ffffff;
    }

    .room-option .room-tagline {
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.6);
    }

    #interaction-hint {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(220, 90, 11, 0.5);
      color: #fff;
      font-size: 15px;
      pointer-events: none;
      z-index: 1000;
    }

    @media (max-width: 1366px) {
      #chat-box {
        width: 420px;
        height: 380px;
        left: 20px;
        bottom: 85px;
      }

      #chat-container {
        width: 550px;
      }
    }

    @media (max-width: 1024px) {
      #chat-box {
        width: 380px;
        height: 320px;
        left: 15px;
        bottom: 85px;
      }

      #chat-container {
        width: 450px;
      }

      .chat-message {
        font-size: 13.5px;
        padding: 5px 10px;
      }
    }

    /* Below ~900px the round buttons (emotes, mic, settings, customize) no
       longer fit to the right of the chat input: they sit in a row above it,
       right-aligned, and the chat log moves up to make room. */
    @media (max-width: 900px) {
      #emote-button { right: 0; bottom: 55px; }
      #voice-button { right: 52px; bottom: 55px; }
      #voice-settings-button { right: 104px; bottom: 59px; }
      #customize-button { right: 149px; bottom: 59px; }
      #help-button { right: 194px; bottom: 59px; }
      #voice-settings {
        right: 0;
        bottom: 110px;
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 140px);
      }
      #chat-box { bottom: 125px; }
    }

    @media (max-width: 768px) {
      .model-options {
        grid-template-columns: repeat(2, 1fr);
      }

      .model-preview {
        height: 160px;
      }

      #chat-box {
        width: 320px;
        height: 260px;
        left: 10px;
      }

      #chat-container {
        width: 400px;
      }


      .chat-message {
        font-size: 13px;
        padding: 5px 8px;
        line-height: 1.25;
      }

      #chat-input {
        padding: 12px 18px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .model-options {
        grid-template-columns: repeat(1, 1fr);
      }

      .model-preview {
        height: 200px;
      }

      #chat-box {
        width: calc(100% - 20px);
        height: 220px;
        left: 10px;
        right: 10px;
        bottom: 125px;
      }

      #chat-container {
        width: calc(100% - 20px);
      }

      #chat-input {
        padding: 10px 15px;
        font-size: 13px;
      }

      .chat-message {
        font-size: 12.5px;
        padding: 4px 8px;
        line-height: 1.2;
      }
    }
  </style>
</head>

<body>
  <div id="username-dialog">
    <h3>Bienvenido a la Taberna Virtual de MV Gamedev</h3>
    <input type="text" id="username-input" placeholder="Introduce tu nombre" maxlength="15" />
    <div class="model-selector">
      <h4>Elige tu personaje:</h4>
      <div class="model-options">
        <div class="model-option" data-model="pj">
          <div class="model-preview" id="preview-pj"></div>
          <span>1</span>
        </div>
        <div class="model-option" data-model="pj2">
          <div class="model-preview" id="preview-pj2"></div>
          <span>2</span>
        </div>
        <div class="model-option" data-model="pj3">
          <div class="model-preview" id="preview-pj3"></div>
          <span>3</span>
        </div>
        <div class="model-option" data-model="pj4">
          <div class="model-preview" id="preview-pj4"></div>
          <span>4</span>
        </div>
        <div class="model-option" data-model="pj5">
          <div class="model-preview" id="preview-pj5"></div>
          <span>5</span>
        </div>
        <div class="model-option" data-model="pj6">
          <div class="model-preview" id="preview-pj6"></div>
          <span>6</span>
        </div>
      </div>
    </div>
    <div class="room-selector">
      <h4>Elige tu bar:</h4>
      <div class="room-options" id="room-options" role="radiogroup" aria-label="Bar"></div>
    </div>
    <button id="start-button">Entrar al Bar</button>
  </div>
  <div id="chat-box" class="hidden"></div>
  <div id="interaction-hint" class="hidden"></div>
  <div id="chat-container" class="hidden">
    <input type="text" id="chat-input" placeholder="Escribe tu mensaje... (Enter para enviar, /me para emotes)"
      maxlength="200" />
  </div>
  <script type="module" src="/src/ui/emotes.js"></script>
  <script type="module" src="/src/ui/EmotesUI.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
